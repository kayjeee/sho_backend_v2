version: "3.9"

services:
  web:
    build:
      context: .
      target: development
    env_file:
      - .env
    environment:
      RAILS_ENV: development
      PORT: 4000
    ports:
      - "4000:4000"
    volumes:
      - .:/rails:cached
    command: bundle exec rails server -b 0.0.0.0 -p 4000
    stdin_open: true
    tty: true

  web-prod:
    build:
      context: .
      target: production
    env_file:
      - .env
    environment:
      RAILS_ENV: production
      RAILS_MASTER_KEY: ${RAILS_MASTER_KEY}
      MONGODB_URI: ${MONGODB_URI}
    ports:
      - "80:80"
    command: bundle exec rails server -e production -b 0.0.0.0 -p 80
