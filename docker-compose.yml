version: "3.9"

services:
  # ---------------------------------------
  # Local development environment
  # ---------------------------------------
  web:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      RAILS_ENV: development
      PORT: 4000
    ports:
      - "4000:4000"
    volumes:
      - .:/app:cached
    command: bundle exec rails server -b 0.0.0.0 -p 4000
    stdin_open: true
    tty: true

  # ---------------------------------------
  # Production environment (for Railway or local prod)
  # ---------------------------------------
  web-prod:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      RAILS_ENV: production
      RACK_ENV: production
      RAILS_MASTER_KEY: ${RAILS_MASTER_KEY}
      MONGODB_URI: ${MONGODB_URI}
      PORT: 3000
    ports:
      - "3000:3000"
    command: bundle exec rails server -e production -b 0.0.0.0 -p 3000
