version: "3.9"

services:
  redis:
    image: redis:7-alpine
    container_name: sho_redis
    ports:
      - "6379:6379"

  web:
    build: .
    container_name: sho_backend
    command: ./bin/thrust ./bin/rails server -b 0.0.0.0 -p 80
    ports:
      - "4000:80"
    environment:
      RAILS_ENV: development
      REDIS_URL: redis://redis:6379/1
    depends_on:
      - redis