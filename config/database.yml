# config/database.yml
default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  timeout: 5000
  # Optional SSL mode for production
  # sslmode: require

development:
  <<: *default
  database: <%= ENV.fetch("DB_NAME_DEV") { "myapp_development" } %>
  username: <%= ENV.fetch("DB_USERNAME_DEV") { "postgres" } %>
  password: <%= ENV.fetch("DB_PASSWORD_DEV") { "password" } %>
  host: <%= ENV.fetch("DB_HOST_DEV") { "localhost" } %>
  port: <%= ENV.fetch("DB_PORT_DEV") { 5432 } %>

test:
  <<: *default
  database: <%= ENV.fetch("DB_NAME_TEST") { "myapp_test" } %>
  username: <%= ENV.fetch("DB_USERNAME_TEST") { "postgres" } %>
  password: <%= ENV.fetch("DB_PASSWORD_TEST") { "password" } %>
  host: <%= ENV.fetch("DB_HOST_TEST") { "localhost" } %>
  port: <%= ENV.fetch("DB_PORT_TEST") { 5432 } %>

production:
  <<: *default
  primary:
    database: <%= ENV.fetch("DB_NAME") { "dummy_db" } %>
    username: <%= ENV.fetch("DB_USERNAME") { "postgres" } %>
    password: <%= ENV.fetch("DB_PASSWORD") { "password" } %>
    host: <%= ENV.fetch("DB_HOST") { "localhost" } %>
    port: <%= ENV.fetch("DB_PORT") { 5432 } %>
    sslmode: require

  # Optional: secondary/replica for read-only queries
  # This allows Rails 8 multiple DB connections
  # reading:
  #   database: <%= ENV.fetch("DB_NAME_READ") { "dummy_db_read" } %>
  #   username: <%= ENV.fetch("DB_USERNAME_READ") { "postgres" } %>
  #   password: <%= ENV.fetch("DB_PASSWORD_READ") { "password" } %>
  #   host: <%= ENV.fetch("DB_HOST_READ") { "localhost" } %>
  #   port: <%= ENV.fetch("DB_PORT") { 5432 } %>
  #   sslmode: require

# -------------------------
# Prevent DB access during Docker assets precompile
# -------------------------
<% if ENV['SKIP_DB'] %>
production:
  primary:
    database: dummy_db
    username: postgres
    password: password
    host: localhost
    port: 5432
    sslmode: require
<% end %>
