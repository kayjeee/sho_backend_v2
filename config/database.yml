default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  url: <%= ENV["DATABASE_URL"] %>

development:
  <<: *default
  database: sho_development

test:
  <<: *default
  database: sho_test

production:
  <<: *default
  database: sho_production
  cable:
    <<: *default
    database: sho_production
