# config/database.yml

default: &default
  adapter: sqlite3
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  timeout: 5000
  encoding: utf8

development:
  primary:
    <<: *default
    database: db/development.sqlite3

  cache:
    <<: *default
    database: db/solid_cache_development.sqlite3

test:
  primary:
    <<: *default
    database: db/test.sqlite3

  cache:
    <<: *default
    database: db/solid_cache_test.sqlite3

production:
  primary:
    url: <%= ENV["DATABASE_URL"] %>
    pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
    timeout: 5000
    encoding: utf8

  cache:
    url: <%= ENV["CACHE_DATABASE_URL"] %>
    pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
    timeout: 5000
    encoding: utf8
