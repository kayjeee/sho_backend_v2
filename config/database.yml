# config/database.yml

default: &default
  adapter: sqlite3
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  timeout: 5000
  encoding: utf8

development:
  primary:
    <<: *default
    database: db/development.sqlite3

  cache:
    <<: *default
    database: db/solid_cache_development.sqlite3

test:
  primary:
    <<: *default
    database: db/test.sqlite3

  cache:
    <<: *default
    database: db/solid_cache_test.sqlite3

production:
  primary:
    <<: *default
    url: <%= ENV.fetch("DATABASE_URL", "sqlite3:db/production.sqlite3") %>

  cache:
    <<: *default
    url: <%= ENV.fetch("CACHE_DATABASE_URL", "sqlite3:db/solid_cache_production.sqlite3") %>
